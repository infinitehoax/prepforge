[package]
name = "prepforge"
version = "1.0.0"
description = "PrepForge — JAMB & WAEC Practice App"
authors = ["you"]
license = ""
repository = ""
default-run = "prepforge"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "prepforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
